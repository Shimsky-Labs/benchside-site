<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benchside · pair a camera</title>
<style>:root{--g:#0E332A;--y:#E9B949;--c:#FFF6E3}body{margin:0;background:var(--g);color:var(--c);font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
h1{color:var(--y);margin:0 0 8px}p{max-width:520px;line-height:1.5}a.btn{display:inline-block;background:var(--y);color:var(--g);font-weight:700;padding:12px 22px;border-radius:999px;text-decoration:none;margin:8px}small{opacity:.6}</style></head>
<body><div>
<h1>Pair as a second camera</h1>
<p id="msg">Opening Benchside…</p>
<p><a class="btn" id="open" href="#">Open Benchside</a></p>
<p>This code is for the Benchside app. Install Benchside from the App Store on this phone, then scan the code again from Benchside: Settings, More camera angles, “Use this phone as a second camera”.</p>
<!-- App Store link placeholder: when the listing is live, add a link to it here. -->
<p><small><a href="index.html" style="color:var(--y)">What is Benchside?</a></small></p>
<script>
  // The name and code arrive after the "#", so they are never sent to this web server.
  var deep = 'benchside://pair?' + (location.hash ? location.hash.slice(1) : location.search.slice(1));
  document.getElementById('open').href = deep;
  setTimeout(function(){ window.location.href = deep; }, 150);
  setTimeout(function(){ document.getElementById('msg').textContent = 'If Benchside did not open, it is not installed on this device yet.'; }, 2500);
</script>
</div></body></html>
